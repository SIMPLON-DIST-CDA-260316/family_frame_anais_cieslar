services:
  mongodb:
    image: mongo:8.0.38-noble
    volumes :
      - /data/db
    command: --replSet rs0
    networks:
      - familyframe
    healthcheck:
      test: ["CMD","mongosh","--quiet", "--eval", "try {rs.status()} catch (e) {rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] })} db.hello().isWritablePrimary || quit(1)"]
      interval: 3s
      timeout: 10s
      retries: 10
      start_period: 5s

  api:
    build: ./server
    ports :
    - "3000:3000"
    networks:
      - familyframe
    env_file:
      - ./server/.env.docker
    volumes:
      - ./server:/server
      - /server/node_modules
    depends_on:
      mongodb:
        condition: service_healthy

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    ports:
      - "8081:8081"
    networks:
      - familyframe
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0
    depends_on:
      mongodb:
        condition: service_healthy

networks:
  familyframe: